name: school-reports

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  # ‏`:?` لا `:-` عن قصد. الافتراض السابق `school-reports:local` كان وسماً لا
  # وجود له على الخادم، فأيّ `docker compose up -d` يدوي بلا `APP_IMAGE` — وهو
  # ما يفعله كل من يعدّل متغيّر بيئة ثم يعيد التشغيل — كان **يستبدل صورة
  # الإنتاج بصمت** بوسم فارغ أو قديم: يفشل `collectstatic` بخطأ صلاحيات مضلِّل،
  # ويتوقف الموقع، ولا شيء في الرسالة يشير إلى الصورة.
  #
  # الآن يرفض compose التشغيل ويقول السبب. و`remote_deploy.sh` يكتب الوسم
  # المنشور في `.env` بجانب ملف compose، فتعمل الأوامر اليدوية على الصورة
  # الصحيحة تلقائياً بلا أن يتذكر أحد تصديرها.
  image: ${APP_IMAGE:?APP_IMAGE must be set. It is written to .env beside this file by remote_deploy.sh; source it or export the deployed image ref before running compose by hand.}
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=128m,mode=1777
  env_file:
    - ${ENV_FILE:-deploy/hetzner/env.production}
  environment:
    RELEASE_SHA: ${RELEASE_SHA:-unknown}
    RELEASE_IMAGE: ${APP_IMAGE}
  volumes:
    - ./deploy/hetzner/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    # Celery renders branded emails outside the web container. Production's
    # manifest storage must therefore be visible to every worker after the
    # migrate service has populated it with collectstatic.
    - static-data:/app/staticfiles:ro
  logging: *default-logging
  depends_on:
    postgres:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
    redis-limits:
      condition: service_healthy
  networks:
    - backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Keep application/payment/API secrets out of the database container.
    # This file is created once on the server from the three POSTGRES_* values
    # in env.production and is never shipped by CI.
    env_file:
      - ${POSTGRES_ENV_FILE:-deploy/hetzner/env.postgres}
    logging: *default-logging
    mem_limit: 2048m
    shm_size: 128m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  # Runtime connection pooler. Web/workers use DATABASE_POOL_URL while the
  # one-shot migration service clears it and keeps the direct DATABASE_URL.
  # Transaction mode is required: Django issues SET/RESET per connection. Keep
  # CONN_MAX_AGE=0 — reuse belongs to the pooler, not short-lived ASGI threads.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Contains only the direct DATABASE_URL. The image parses it to build both
    # the upstream target and SCRAM credentials; POSTGRES_* alone is not read by
    # this image and previously left the optional profile unable to authenticate.
    env_file:
      - ${PGBOUNCER_ENV_FILE:-deploy/hetzner/env.pgbouncer}
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN:-500}"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE:-20}"
      SERVER_IDLE_TIMEOUT: "300"
      SERVER_LIFETIME: "3600"
      AUTH_TYPE: scram-sha-256
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $${POSTGRES_USER}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Redis needs only its password and memory policy, not every application
    # secret from env.production.
    env_file:
      - ${REDIS_ENV_FILE:-deploy/hetzner/env.redis}
    logging: *default-logging
    mem_limit: 512m
    # One Redis serves three roles: Celery broker (DB 0), Channels layer (DB 0)
    # and the Django cache/sessions (DB 1). With `noeviction`, a traffic spike
    # that fills the cache makes Redis reject *every* write — which takes the
    # broker down with it, not just the cache.
    # `volatile-lru` only evicts keys that carry a TTL: cache entries, sessions
    # and Channels groups. Celery's queues have no TTL, so queued tasks are
    # never dropped. Degrade the cache, keep the platform up.
    command: >-
      sh -c 'exec redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory "$${REDIS_MAXMEMORY:-384mb}"
      --maxmemory-policy "$${REDIS_MAXMEMORY_POLICY:-volatile-lru}"
      --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  # مخزن عدّادات الحدود — منفصل عن Redis الرئيسي عن قصد.
  #
  # الرئيسي يعمل بـ `volatile-lru` كي يبقى الوسيط حيًّا حين يمتلئ الكاش، وهو
  # الاختيار الصحيح هناك. لكن العدّاد المُخلى يُقرأ «صفر محاولات» — أي أن
  # الإخلاء يمحو حدَّ الدخول وميزانية المدرسة وسقف فاتورة المساعد، صامتًا،
  # وفي لحظة الضغط تحديدًا.
  #
  # `noeviction` هنا آمن لأن الحجم صغير بطبعه: عدّاد لكل معرِّف/عنوان بنافذة
  # دقائق، وكلها تحمل TTL فتنتهي بذاتها. 96MB سقفٌ واسع لعشرات آلاف العدّادات.
  #
  # ولا `appendonly` عمدًا: ضياع عدّاد عمره دقائق عند إعادة التشغيل مقبول،
  # والكتابة إلى القرص لكل محاولة دخول ثمنٌ بلا مقابل.
  redis-limits:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${REDIS_ENV_FILE:-deploy/hetzner/env.redis}
    logging: *default-logging
    mem_limit: 128m
    command: >-
      sh -c 'exec redis-server
      --maxmemory "$${REDIS_LIMITS_MAXMEMORY:-96mb}"
      --maxmemory-policy noeviction
      --save ""
      --requirepass "$${REDIS_PASSWORD}"'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  migrate:
    <<: *app
    restart: "no"
    mem_limit: 2048m
    # Schema changes use the direct PostgreSQL route. Runtime web/workers use
    # DATABASE_POOL_URL through PgBouncer; clearing it here keeps migrations
    # independent of transaction-pooling semantics.
    environment:
      DATABASE_POOL_URL: ""
      RELEASE_SHA: ${RELEASE_SHA:-unknown}
      RELEASE_IMAGE: ${APP_IMAGE}
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput"
    volumes:
      - static-data:/app/staticfiles

  web:
    <<: *app
    mem_limit: 1536m
    cpus: 2.00
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sizing: WEB_CONCURRENCY is the number of OS processes. Requests inside a
    # process run concurrently on their own threads (ASGI), so raise this to add
    # CPU parallelism, not I/O concurrency. Budget ~250 MB per worker against
    # mem_limit and raise `cpus` alongside it; keep
    # WEB_CONCURRENCY × MAX_CONCURRENT_REQUESTS below PostgreSQL max_connections
    # minus the Celery workers and beat.
    # `--threads` is intentionally absent: the Uvicorn worker ignores it, so
    # passing it only creates false confidence about capacity.
    # `sh -c` with $$VAR on purpose: a bare ${VAR} here is expanded by Compose
    # from the host shell, so values set in env_file were silently ignored and
    # every deploy ran a single worker no matter what the env file said.
    command: >-
      sh -c 'exec gunicorn config.asgi:application
      --bind 0.0.0.0:8000
      -k uvicorn.workers.UvicornWorker
      --workers "$${WEB_CONCURRENCY:-1}"
      --timeout "$${GUNICORN_TIMEOUT:-120}"
      --keep-alive "$${GUNICORN_KEEPALIVE:-5}"
      --max-requests "$${GUNICORN_MAX_REQUESTS:-800}"
      --max-requests-jitter "$${GUNICORN_MAX_REQUESTS_JITTER:-80}"
      --access-logfile -
      --error-logfile -'
    ports:
      # Compose-level substitution: this one really is read from the host shell
      # or a .env file beside this compose file, never from env_file.
      - "127.0.0.1:${LOCAL_HTTP_PORT:-18000}:8000"
    volumes:
      - static-data:/app/staticfiles:ro
      - ./deploy/hetzner/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request = urllib.request.Request(
          "http://127.0.0.1:8000/healthz/",
          headers={"Host": "tawtheeq-ksa.com", "X-Forwarded-Proto": "https"});
          urllib.request.urlopen(request, timeout=8).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      backend:
      edge:
        aliases:
          - school-reports-web

  worker-core:
    <<: *app
    mem_limit: 768m
    cpus: 0.50
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./deploy/hetzner/firebase-service-account.json}:/run/secrets/firebase-service-account.json:ro
      - static-data:/app/staticfiles:ro
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >-
      sh -c 'exec celery -A config worker
      --loglevel=info
      --concurrency="$${CELERY_CORE_CONCURRENCY:-1}"
      --prefetch-multiplier=1
      --max-tasks-per-child=100
      -Q default,notifications'

  # يحمل الآن توليد PDF إلى جانب معالجة الصور والمهام الدورية. WeasyPrint
  # يقفز بالذاكرة أثناء التصيير، والطلب ينتظر النتيجة — فرُفع نصيبه من المعالج
  # والذاكرة، ورُفعت التزامنية إلى اثنتين كي لا يصطفّ طلبان خلف بعضهما حيث
  # كانا يُصيَّران متوازيين على عامل الويب من قبل.
  #
  # وتبقى ``--max-tasks-per-child=50`` هي الحارس: WeasyPrint معروف بتشظّي
  # الذاكرة، وإعادة تدوير العملية دورياً أرخص من ملاحقة التسرّب.
  worker-media:
    <<: *app
    mem_limit: 1536m
    cpus: 1.00
    networks:
      - backend
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: >-
      sh -c 'exec celery -A config worker
      --loglevel=info
      --concurrency="$${CELERY_MEDIA_CONCURRENCY:-2}"
      --prefetch-multiplier=1
      --max-tasks-per-child=50
      -Q images,periodic'

  beat:
    <<: *app
    mem_limit: 160m
    cpus: 0.20
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: celery -A config beat --loglevel=info

networks:
  backend:
    internal: true
  edge:
    external: true
    name: school-platform-edge

volumes:
  postgres-data:
  redis-data:
  static-data:
