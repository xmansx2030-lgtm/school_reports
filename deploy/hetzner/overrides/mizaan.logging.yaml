# Reference policy also applied directly to the deployed Mizaan compose.yaml
# on 2026-10-12. Keep these logging blocks when producing a new release bundle.
# Merely shipping this reference file does not change another project's runtime.
# If used as an override, retain both existing Compose files and recreate only
# garage and clamav; do not restart the database, web application, or scanner.
services:
  garage:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
  clamav:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
