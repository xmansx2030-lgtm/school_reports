<div class="twq-field teacher-plan-form__field{% if field.errors %} twq-field--error{% endif %}{% if field.name == 'description' %} teacher-plan-form__field--wide{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="teacher-plan-form__choice" for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
    <label class="twq-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
  {% endif %}
  {% if field.help_text %}<small class="twq-field__help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<span id="{{ field.id_for_label }}_errors">{% for error in field.errors %}<small class="twq-field__message" role="alert">{{ error }}</small>{% endfor %}</span>{% endif %}
</div>
