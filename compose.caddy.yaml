services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # This proxy serves every project on the shared edge network. Leave ample
    # headroom while preventing an unbounded process from exhausting the host.
    mem_limit: 512m
    mem_reservation: 128m
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/hetzner/Caddyfile.fragment:/etc/caddy/Caddyfile:ro
      - ${XMANSX_ORIGIN_CERT_FILE:-/opt/tanal/ssl/origin.crt}:/run/tls/xmansx-origin.crt:ro
      - ${XMANSX_ORIGIN_KEY_FILE:-/opt/tanal/ssl/origin.key}:/run/tls/xmansx-origin.key:ro
      - ${SCHOOL_DISPLAY_ORIGIN_CERT_FILE:-/opt/school-display/ssl/origin.crt}:/run/tls/school-display-origin.crt:ro
      - ${SCHOOL_DISPLAY_ORIGIN_KEY_FILE:-/opt/school-display/ssl/origin.key}:/run/tls/school-display-origin.key:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
