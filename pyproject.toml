[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".venv",
  "media",
  "staticfiles",
  "pytest-cache-files-*",
  "reports/migrations",
  "maintenance/migrations",
  "operations/migrations",
]

[tool.ruff.lint]
# القاعدة الأصلية (E9/F63/F7/F82) تمسك أخطاء الصياغة والأسماء غير المعرّفة
# وحدها. أُضيفت إليها مجموعتان تمسكان ما لا يمسكه التصريف:
#
#   S  (flake8-bandit) — الأنماط الأمنية داخل المحرر لا في CI وحده.
#   B  (flake8-bugbear) — مصائد وقتِ التشغيل: القيمة الافتراضية المتغيّرة،
#      و``except`` الفارغ الذي يبتلع الخطأ، والمتغيّر المُلتقَط في حلقة.
#
# فحص الاستيرادات والمتغيّرات غير المستخدمة مفعّل صراحةً. الاستثناء الوحيد
# هو وحدات التوافق القديمة التي تعمل كـ import hubs؛ حصرُها أدناه يمنع أن
# تتحول استثناءاتها إلى سياسة عامة تخفي imports ميتة في الملفات الجديدة.
select = ["E9", "F63", "F7", "F82", "F401", "F841", "B", "S"]

ignore = [
  # S101: ``assert`` — أصلُ الاختبارات، ولا يُستعمل في كود التشغيل هنا.
  "S101",
  # S105: تُطلق على كل ثابتٍ اسمه فيه "PASSWORD" أو "SECRET" — ومعظمها هنا
  # **أسماء مفاتيح جلسة** (``FORCE_PASSWORD_CHANGE_SESSION_KEY``) أو أسماء
  # إعدادات، لا أسراراً. الأسرار الحقيقية تُقرأ من البيئة، ويحرسها
  # ``production_preflight`` بفحص قوة ``SECRET_KEY``.
  "S105",
  # ── S110/S112 لم تعودا مُستثنَيتين ────────────────────────────────────────
  # كانتا كذلك حين كان في المشروع 286 موضعاً يبتلع استثناءه صامتاً، وإخضاعُها
  # جميعاً داخل تغييرٍ أمني كان يُغرق المراجعة فيما ليس منها. وقد نُظِّفت
  # المسارات الساخنة والأمنية والمالية منها بالكامل، فصار المنعُ ممكناً.
  #
  # والقرار الأصلي لم يُنقض: بطاقةٌ جانبية تسقط ما زالت لا تُسقط الصفحة. ما
  # تغيّر أن سقوطها صار **مُعلَناً** — عبر ``core.observability`` التي تُسمّي كل
  # ابتلاع وتسجّله وتعدّه. فالقاعدة الآن: لا ابتلاع بلا اسم.
  #
  # وما بقي من مواضع مُدرَج في ``per-file-ignores`` أدناه — قائمةٌ **تتقلّص**،
  # ومكانها هناك يعني «لم يُراجَع بعد» لا «مقبول».
  #
  # البديل حين يكون الابتلاع صحيحاً حقاً: اصطياد النوع المحدَّد
  # (``except FieldDoesNotExist``) — فالنوعُ المحدَّد يقول إن الحالة متوقَّعة،
  # و``Exception`` العارية تقول إن أحداً لم يفكّر فيها.
  # B008: الاستدعاء داخل القيمة الافتراضية — نمط Django معتاد.
  "B008",
  # B023: المتغيّر المُلتقَط في حلقة — مستعمل فوراً في كل مواضعه هنا.
  "B023",
]

[tool.ruff.lint.per-file-ignores]
# ── ديْن الابتلاع الصامت المتبقّي (S110/S112) ──────────────────────────────
# هذه القائمة **دَين مُعلَن**، لا سياسة. كل ملف فيها يحوي مواضع لم تُراجَع بعد،
# ووجودها هنا يجعل العدد مرئياً في مكان واحد بدل أن يذوب في 107 آلاف سطر.
#
# القاعدة عند لمس أي ملف منها: نظّف مواضعه — إمّا باسمٍ عبر
# ``core.observability`` أو باصطياد النوع المحدَّد — ثم **احذف سطره من هنا**.
# ولا يُضاف إليها ملف جديد.
"reports/services_archive.py" = ["S110", "S112"]
"config/settings.py" = ["S110", "S112"]
"reports/model_parts/achievements.py" = ["S110", "S112"]
"reports/model_parts/signals.py" = ["S110", "S112"]
"reports/model_parts/meetings.py" = ["S110", "S112"]
"reports/model_parts/plans.py" = ["S110", "S112"]
"reports/model_parts/schools.py" = ["S110", "S112"]
"reports/model_parts/approvals.py" = ["S110", "S112"]
"reports/model_parts/assignments.py" = ["S110", "S112"]
"reports/model_parts/audit.py" = ["S110", "S112"]
"reports/model_parts/circular_drafts.py" = ["S110", "S112"]
"reports/model_parts/documents.py" = ["S110", "S112"]
"reports/model_parts/lab.py" = ["S110", "S112"]
"reports/views/achievements.py" = ["S110", "S112"]
"reports/views/tickets.py" = ["S110", "S112"]
"reports/views/home.py" = ["S110", "S112"]
"reports/views/platform.py" = ["S110", "S112"]
"reports/views/_helpers.py" = ["F401", "S110", "S112"]
"reports/services_export.py" = ["S110", "S112"]
"reports/services_reports.py" = ["S110", "S112"]
"reports/services_achievement.py" = ["S110", "S112"]
"reports/services_meetings.py" = ["S110", "S112"]
"reports/storage.py" = ["S110", "S112"]
"reports/pdf_report.py" = ["S110", "S112"]
"reports/pdf_offload.py" = ["S110", "S112"]
"reports/realtime_notifications.py" = ["S110", "S112"]
"reports/consumers.py" = ["S110", "S112"]
"reports/admin.py" = ["S110", "S112"]
"reports/models.py" = ["S110", "S112"]
"reports/middleware_single_session.py" = ["S110", "S112"]
"reports/validators.py" = ["S110", "S112"]
"reports/context_processors.py" = ["S110", "S112"]
"deploy/hetzner/apply_runtime_config.py" = ["S110", "S112"]

# الاختبارات: مسارات مؤقتة ثابتة وكلمات مرور تجريبية، وكلاهما بيانات اختبار.
"reports/tests/*" = ["S106", "S107", "S108", "S110", "S112"]
"maintenance/tests.py" = ["S106", "S107", "S108"]
"operations/tests.py" = ["S106", "S107", "S108"]
"core/tests.py" = ["S106", "S107", "S108"]
# بيانات أداء اصطناعية: ``random`` هنا لتوليد عيّنات لا لتوليد أسرار.
"reports/management/commands/seed_perf.py" = ["S311", "S110", "S112"]
# "0.0.0.0" قيمةٌ راجعة تدلّ على «عنوان غير معروف» في حساب حدّ المعدل،
# لا ربطَ مقبس على كل الواجهات.
"core/client_ip.py" = ["S104", "S110", "S112"]
# بوابات الدفع والتنبيهات: العناوين من الإعدادات لا من المستخدم، وثابتةٌ
# قواعدُها في وحداتها (https صراحةً، ومهلة على كل نداء).
# أدوات تشغيلية يدوية: العنوان يأتي من سطر الأوامر الذي يكتبه المشغّل نفسه،
# ولا تعمل هذه الملفات داخل الخادم ولا تستقبل مدخلاً من مستخدم.
"scripts/loadtest.py" = ["S310"]
"scripts/hetzner_server_check.py" = ["S310", "S110", "S112"]
"reports/moyasar_gateway.py" = ["S310"]
"reports/telegram_alerts.py" = ["S310", "S110", "S112"]
"reports/mansour_assistant.py" = ["S310"]
"reports/report_ai.py" = ["S310"]

# وحدات توافق تصدّر أسماءها إلى ملفات النماذج/العروض القديمة عبر ``import *``.
# إزالة F401 منها آلياً تكسر أسماءً تُستهلك في الوحدة المستورِدة. هذا دين
# معماري محصور يجب إزالته عند استبدال import hubs باستيرادات صريحة.
"reports/model_parts/base.py" = ["F401"]
"reports/views/billing_core.py" = ["F401"]
"reports/views/billing_gateways.py" = ["F401"]
"reports/views/billing_platform.py" = ["F401"]
"reports/views/billing_school.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = [
  "core/client_ip.py",
  "core/task_dispatch.py",
  "operations/task_names.py",
  "reports/services_capacity.py",
  "reports/services_generated_exports.py",
  "reports/services_notifications.py",
  "reports/task_names.py",
]
# Progressive boundary: dependencies outside this explicit list are not yet
# treated as typed. Expanding the list requires making that module pass first.
follow_imports = "skip"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
