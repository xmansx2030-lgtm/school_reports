{% comment %}
مشاركة الاجتماع بنسخ رابطه.

الرابط ليس عاماً: صفحة الاجتماع لا تُفتح إلا لمنظّمه أو مدعوّ إليه أو مدير
المدرسة. فالمشاركة هنا توصيل عنوان لمن يملك الدخول أصلاً، لا فتحُ الاجتماع
لمن لا يحق له الاطلاع عليه — ومن يحتاج نسخة خارج المنصة يأخذ المحضر المطبوع.
{% endcomment %}
<script nonce="{{ CSP_NONCE }}" data-cfasync="false">
  (function () {
    var triggers = document.querySelectorAll('[data-copy-link]');
    if (!triggers.length) return;

    function notify(message) {
      if (window.showAppToast) {
        window.showAppToast(message, 'success');
      } else if (window.rcAlert) {
        window.rcAlert(message, { type: 'info' });
      }
    }

    async function copy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      /* execCommand is deprecated but still the only fallback on http:// and on
         older in-app browsers, where navigator.clipboard is simply absent. */
      var field = document.createElement('textarea');
      field.value = text;
      field.setAttribute('readonly', '');
      field.style.position = 'fixed';
      field.style.opacity = '0';
      document.body.appendChild(field);
      field.select();
      try { document.execCommand('copy'); } finally { field.remove(); }
    }

    triggers.forEach(function (trigger) {
      trigger.addEventListener('click', async function () {
        var url = trigger.getAttribute('data-copy-link') || '';
        var title = trigger.getAttribute('data-share-title') || document.title;
        if (!url) return;

        // On phones the OS sheet is the expected way to pass a link along.
        if (navigator.share && trigger.hasAttribute('data-share-native')) {
          try {
            await navigator.share({ title: title, url: url });
            return;
          } catch (error) {
            if (error && error.name === 'AbortError') return;
          }
        }

        try {
          await copy(url);
          notify('نُسخ رابط الاجتماع — يفتح لمن دُعي إليه فقط.');
        } catch (error) {
          await window.rcPrompt('تعذر النسخ التلقائي. انسخ الرابط يدويًا:', url, {
            required: false,
            title: 'نسخ رابط الاجتماع',
            okText: 'إغلاق'
          });
        }
      });
    });
  })();
</script>
