<section
  class="passkey-offer"
  id="passkeyEnrollmentOffer"
  aria-labelledby="passkeyOfferTitle"
  hidden
>
  <div class="passkey-offer__head">
    <span class="passkey-offer__icon" aria-hidden="true">
      <i class="fa-solid fa-fingerprint"></i>
    </span>
    <div>
      <h3 class="passkey-offer__title" id="passkeyOfferTitle">دخول أسرع من هذا الجهاز</h3>
      <p class="passkey-offer__text">
        يمكنك تفعيل بصمة الجهاز أو Face ID أو قفل الشاشة. هذا الخيار اختياري، وكلمة المرور ستبقى متاحة دائمًا.
      </p>
    </div>
  </div>

  <div class="passkey-offer__actions">
    <button type="button" class="passkey-offer__button passkey-offer__button--primary" id="passkeyOfferActivate">
      <i class="fa-solid fa-fingerprint" aria-hidden="true"></i>
      تفعيل الآن
    </button>
    <button type="button" class="passkey-offer__button" id="passkeyOfferSnooze">
      <i class="fa-regular fa-clock" aria-hidden="true"></i>
      ذكّرني بعد 90 يومًا
    </button>
    <button type="button" class="passkey-offer__button passkey-offer__button--quiet" id="passkeyOfferNever">
      لا تعرض هذه الرسالة مجددًا
    </button>
  </div>
  <p class="passkey-offer__status" id="passkeyOfferStatus" role="status" aria-live="polite"></p>
</section>

<script nonce="{{ CSP_NONCE }}" data-cfasync="false">
  document.addEventListener('DOMContentLoaded', function () {
    var offer = document.getElementById('passkeyEnrollmentOffer');
    var activate = document.getElementById('passkeyOfferActivate');
    var snooze = document.getElementById('passkeyOfferSnooze');
    var never = document.getElementById('passkeyOfferNever');
    var status = document.getElementById('passkeyOfferStatus');
    var preferences = window.tawtheeqPasskeyPreferences;
    if (!offer || !activate || !snooze || !never || !preferences) return;

    function setBusy(busy) {
      snooze.disabled = busy;
      never.disabled = busy;
    }

    function showError(message) {
      if (!status) return;
      status.textContent = message || 'تعذر حفظ الاختيار. تحقق من الاتصال ثم أعد المحاولة.';
      status.classList.add('is-visible');
    }

    activate.addEventListener('click', function () {
      offer.hidden = true;
      var settingsButton = document.getElementById('registerPasskeyBtn');
      if (!settingsButton) return;
      settingsButton.scrollIntoView({ behavior: 'smooth', block: 'center' });
      settingsButton.focus({ preventScroll: true });
      settingsButton.click();
    });

    snooze.addEventListener('click', async function () {
      setBusy(true);
      var result = await preferences.dismiss('snooze');
      if (result.ok || preferences.isSnoozedLocally()) {
        offer.hidden = true;
        return;
      }
      setBusy(false);
      showError(result.message);
    });

    never.addEventListener('click', async function () {
      setBusy(true);
      var result = await preferences.dismiss('never');
      if (result.ok) {
        offer.hidden = true;
        return;
      }
      setBusy(false);
      showError(result.message);
    });

    async function revealWhenSupported() {
      if (preferences.isSuppressedLocally()) return;
      if (!window.isSecureContext || !window.PublicKeyCredential || !navigator.credentials) {
        await preferences.markUnsupported();
        return;
      }
      try {
        if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === 'function') {
          var available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
          if (!available) {
            await preferences.markUnsupported();
            return;
          }
        }
      } catch (error) {
        await preferences.markUnsupported();
        return;
      }
      offer.hidden = false;
    }

    revealWhenSupported();
  });
</script>
