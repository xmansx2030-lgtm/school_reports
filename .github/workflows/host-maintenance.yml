name: Hetzner host maintenance
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: READ-ONLY or APPLY-SCHOOL-DISPLAY-DB-FIX
        required: true
        type: string
      mode:
        description: School-display diagnostics or scoped web repair
        required: true
        default: diagnostics
        type: choice
        options:
          - diagnostics
          - repair-school-display
permissions:
  contents: read
concurrency:
  group: hetzner-host-maintenance
  cancel-in-progress: false
jobs:
  school-display:
    name: School-display connection diagnostics or repair
    if: (inputs.mode == 'diagnostics' && inputs.confirmation == 'READ-ONLY') || (inputs.mode == 'repair-school-display' && inputs.confirmation == 'APPLY-SCHOOL-DISPLAY-DB-FIX')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Run selected scoped operation
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          if test "$MODE" = repair-school-display; then
            ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" 'sudo -n python3 - --apply-school-display-db-fix' < scripts/host_diagnostics.py
          else
            ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_TARGET" 'sudo -n python3 -' < scripts/host_diagnostics.py
          fi
