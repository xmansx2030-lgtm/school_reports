name: Django CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      ENV: test
      DEBUG: "False"
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: ""
      REDIS_URL: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_ENDPOINT_URL: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info \
            libmagic1

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Static correctness checks
        run: |
          ruff check .
          python -m compileall -q config core reports maintenance operations manage.py
          python -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"

      # ملف الأسرار لا يعود إلى التتبع. أُزيل مرة، وبقيت نسخه في التاريخ —
      # والحارس هنا أرخص من تدوير مفتاح إنتاج مرة أخرى.
      - name: Secrets hygiene
        run: |
          tracked="$(git ls-files '.env' '.env.*' 'deploy/hetzner/env.production' 'deploy/hetzner/env.redis' 'deploy/hetzner/env.postgres' | grep -v '\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error title=Secret file tracked by git::$tracked"
            exit 1
          fi
          echo "No secret files are tracked."

      - name: Security checks
        run: |
          # القفل لا requirements.txt: الأخير يصف المباشرة وحدها، والثغرات
          # وصلت الإنتاج عبر ما وراءها.
          python -m pip_audit -r requirements.lock.txt --no-deps
          python -m bandit -r config core reports maintenance operations manage.py \
            -x "reports/tests,reports/migrations,core/migrations,maintenance/migrations,maintenance/tests.py,operations/migrations,operations/tests.py" \
            --severity-level high --confidence-level high --quiet

      # قفلٌ لا يواكب requirements.txt يعني أن ما يُفحص ليس ما يُبنى.
      - name: Dependency lock is in sync
        run: python scripts/check_requirements_lock.py

      - name: Django checks and migration drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Production deployment checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          ENV: production
          DEBUG: "False"
          SECRET_KEY: ci-production-check-only-secret-key-with-sufficient-length
          ALLOWED_HOSTS: example.test
          CSRF_TRUSTED_ORIGINS: https://example.test
          SITE_URL: https://example.test
          BUSINESS_LEGAL_NAME: Test Business
          BUSINESS_FREELANCE_DOCUMENT_NUMBER: FL-CI-TEST
          BUSINESS_ADDRESS: Riyadh
          BUSINESS_SUPPORT_EMAIL: legal@example.test
          BUSINESS_SUPPORT_PHONE: "+966500000000"
          DATABASE_URL: postgresql://school_reports:ci-password@postgres:5432/school_reports
          REDIS_URL: redis://redis:6379/0
          R2_ACCESS_KEY_ID: ci-access-key
          R2_SECRET_ACCESS_KEY: ci-secret-key
          R2_BUCKET_NAME: ci-private-media
          R2_ENDPOINT_URL: https://object-storage.example.test
          MEDIA_PUBLIC_ACCESS_ENABLED: "False"
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST: smtp.example.test
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "True"
          DEFAULT_FROM_EMAIL: no-reply@example.test
        # ‏`collectstatic` هنا لا في النشر وحده.
        #
        # الإنتاج يستعمل `CompressedManifestStaticFilesStorage`، وهو **يفكّ
        # مراجع الأصول داخل ملفات CSS/JS ويعيد كتابتها**. فمرجعٌ إلى ملف غير
        # موجود — `sourceMappingURL` لحزمة مورَّدة بلا خريطتها مثلاً — يُسقط
        # الأمر بـ `MissingFileError`. وتخزين التطوير لا يفعل شيئاً من ذلك، فكل
        # الاختبارات تمرّ خضراء بينما يتوقف النشر عند `migrate`.
        #
        # وهو ليس فرضاً: هذا بالضبط ما أسقط الإصدار a02e61a7 والموقع معه.
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py collectstatic --noinput --clear

      - name: Test
        run: python manage.py test --verbosity 1

      # On main the deploy job builds and pushes the real image, so building
      # here too would just burn a second five-minute build.
      - name: Build production image
        if: github.event_name == 'pull_request'
        run: docker build --tag school-reports:ci .

  deploy:
    name: Deploy to Hetzner
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: write
    # Two deploys racing would let an older image win. Queue instead of cancel:
    # a cancelled deploy could leave the server mid-release.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # الفحوص الثلاثة الأولى تسبق البناء والدفع عمداً. سرٌّ ناقص أو خادم لا
      # يُوصَل إليه كان يُكتشف بعد خمس دقائق بناء وبعد أن يكون وسم latest قد
      # انتقل إلى صورة لم تصل الخادم قط — فيصير الوسم يشير إلى ما لا يعمل.
      - name: Verify deploy credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          missing=""
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_SSH_USER DEPLOY_SSH_HOST WEB_PUSH_VAPID_PRIVATE_KEY WEB_PUSH_VAPID_PUBLIC_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing deploy secrets::Not set:$missing — add them under Settings > Environments > production. See docs/CONTINUOUS_DEPLOYMENT_AR.md"
            exit 1
          fi
          echo "All required deploy secrets are present."

      - name: Configure SSH
        env:
          # السرّ يمرّ عبر البيئة لا داخل نصّ الأمر: الاستبدال النصّي يكتب
          # المفتاح داخل ملف السكربت على الرانر، ومفتاحٌ يحوي محرف اقتباس
          # يكسر الأمر بدل أن يُكتب كما هو.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # umask قبل الكتابة لا chmod بعدها: التوجيه ينشئ الملف بصلاحيات 644،
          # فيبقى المفتاح الخاص مقروءاً حتى يصححه chmod.
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Verify the server is reachable
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
        run: |
          # BatchMode يمنع انتظار كلمة مرور حتى تنتهي مهلة الوظيفة كلها،
          # وConnectTimeout يحوّل خادماً صامتاً إلى فشل سريع.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" \
              -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_TARGET" 'echo "SSH reachable: $(hostname)"'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve image reference
        id: image
        run: |
          # GHCR rejects uppercase in image names; repository owners may have it.
          name="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync compose and deploy files to the server
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          # env.production holds live secrets and exists only on the server —
          # excluded so a deploy can never clobber it.
          tar czf - \
            --exclude='deploy/hetzner/env.production' \
            compose.hetzner.yaml compose.caddy.yaml deploy/hetzner \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"

      - name: Bind the server to this repository
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "set -eu; \
             DEPLOY_PATH='$DEPLOY_PATH' python3 \
               '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' \
               --operations-github-repository '$SOURCE_REPOSITORY'; \
             if git -C '$DEPLOY_PATH' rev-parse --git-dir >/dev/null 2>&1; then \
               git -C '$DEPLOY_PATH' remote set-url origin \
                 'https://github.com/$SOURCE_REPOSITORY.git'; \
               git -C '$DEPLOY_PATH' remote remove upstream 2>/dev/null || true; \
             fi"

      - name: Configure stable Web Push keys
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
          WEB_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.WEB_PUSH_VAPID_PRIVATE_KEY }}
          WEB_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.WEB_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          # Secrets travel over stdin and are never placed in argv or logs.
          printf '%s\n%s\n%s\n' \
            "$WEB_PUSH_VAPID_PRIVATE_KEY" \
            "$WEB_PUSH_VAPID_PUBLIC_KEY" \
            'mailto:support@tawtheeq-ksa.com' \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "DEPLOY_PATH='$DEPLOY_PATH' python3 \
               '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' \
               --web-push-enabled True --web-push-config-from-stdin"

      - name: Configure Firebase mobile notifications
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "FCM_SERVICE_ACCOUNT_JSON is not configured; preserving the server credential."
            exit 0
          fi
          printf '%s' "$FCM_SERVICE_ACCOUNT_JSON" \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "DEPLOY_PATH='$DEPLOY_PATH' python3 \
               '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' \
               --fcm-service-account-from-stdin"

      - name: Configure Resend system email backend
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          # The server already holds RESEND_API_KEY; this only switches Django
          # password resets and subscription notices from SMTP to the Resend API
          # backend. No secret is printed or sent through argv.
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "DEPLOY_PATH='$DEPLOY_PATH' python3 \
               '$DEPLOY_PATH/deploy/hetzner/apply_runtime_config.py' \
               --resend-system-backend \
               --password-change-email-enabled True \
               --subscription-activation-email-enabled True \
               --subscription-expiry-reminder-email-enabled True"

      - name: Release and run migrations
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The registry token goes over stdin, not argv, so it never shows up
          # in the server's process list.
          printf '%s' "$GHCR_TOKEN" \
          | ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
              "DEPLOY_PATH='$DEPLOY_PATH' APP_IMAGE='$APP_IMAGE' \
               GHCR_USER='${{ github.actor }}' GHCR_TOKEN_FROM_STDIN=1 \
               bash '$DEPLOY_PATH/deploy/hetzner/remote_deploy.sh'"

      - name: Import managed project release stamps
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "set -eu; \
             cd '$DEPLOY_PATH'; \
             if sudo -n test -s /srv/tanal/app/.release-sha; then \
               tanal_sha=\$(sudo -n cat /srv/tanal/app/.release-sha); \
               echo \"\$tanal_sha\" | grep -Eq '^[0-9a-f]{40}\$'; \
               docker compose -f compose.hetzner.yaml exec -T web \
                 python manage.py stamp_managed_project_release xmansx \"\$tanal_sha\"; \
             else \
               echo 'TANAL release stamp is not present yet; first managed deploy will create it.'; \
             fi; \
             if sudo -n test -s /opt/school-display/app/.release-commit; then \
               display_sha=\$(sudo -n cat /opt/school-display/app/.release-commit); \
               echo \"\$display_sha\" | grep -Eq '^[0-9a-f]{40}\$'; \
               docker compose -f compose.hetzner.yaml exec -T web \
                 python manage.py stamp_managed_project_release school-display \"\$display_sha\"; \
             else \
               echo 'School Display release stamp is not present yet; first managed deploy will create it.'; \
             fi"

      # The image is what CI tests; the *configuration* is what the server holds,
      # and nothing compared the two. A release once shipped advertising a
      # gateway that was switched off — every test green, the site wrong.
      #
      # production_preflight reads the settings of the container that is actually
      # serving traffic, so it is the only check that can see that gap. It exits 1
      # on any FAIL, which fails the deploy job and makes the drift impossible to
      # miss. Warnings are printed, not fatal: they need a decision, not a rollback.
      - name: Verify the running release
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/school_reports' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" \
            "cd '$DEPLOY_PATH' && docker compose -f compose.hetzner.yaml \
             exec -T web python manage.py production_preflight"

      # ‏preflight يقرأ إعدادات العملية من داخلها، فلا يرى ما تفعله الطبقة التي
      # أمامها. وترويسات الحماية يكتبها Caddy، و``SecurityMiddleware`` لا يستبدل
      # ترويسة موجودة — فكان ``SECURE_HSTS_PRELOAD = True`` مضبوطاً في الإعدادات
      # وغائباً عن الاستجابة، ولا فحص داخلي يكشف ذلك. الرد الحقيقي وحده يفصل.
      - name: Smoke-test the public site
        env:
          SITE_URL: ${{ secrets.PUBLIC_SITE_URL || 'https://tawtheeq-ksa.com' }}
        run: python scripts/post_deploy_smoke.py "$SITE_URL"
